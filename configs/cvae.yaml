# Conditional Variational Autoencoder configuration
model:
  name: "cvae"
  latent_dim: 32          # Also sweep: [2, 8, 32, 128]
  num_classes: 10         # MNIST / Fashion-MNIST
  image_channels: 1
  image_size: 28
  beta: 1.0               # KL weight
  label_embed_dim: 8      # Dense embedding size for one-hot labels

dataset:
  name: "fashion-mnist"  # or "mnist"
  data_root: "./data"
  batch_size: 128
  image_size: 28

training:
  num_epochs: 50
  lr: 0.001
  optimizer: "adam"
  weight_decay: 0.0
  scheduler: null
  device: "cuda"
  save_every: 10

logging:
  log_dir: "./outputs/logs/cvae"
  checkpoint_dir: "./outputs/checkpoints/cvae"
  image_dir: "./outputs/generated_images/cvae"
  use_tensorboard: true
