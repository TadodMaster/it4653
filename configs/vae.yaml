# Variational Autoencoder configuration
model:
  name: "vae"
  latent_dim: 32          # Also sweep: [2, 8, 32, 128]
  image_channels: 1
  image_size: 28
  beta: 1.0               # KL weight (1.0 = standard VAE, β-VAE if >1)

dataset:
  name: "fashion-mnist"  # or "mnist"
  data_root: "./data"
  batch_size: 128
  image_size: 28

training:
  num_epochs: 50
  lr: 0.001
  optimizer: "adam"
  weight_decay: 0.0
  scheduler: null
  device: "cuda"
  save_every: 10

logging:
  log_dir: "./outputs/logs/vae"
  checkpoint_dir: "./outputs/checkpoints/vae"
  image_dir: "./outputs/generated_images/vae"
  use_tensorboard: true

experiments:
  # Experiment: latent_dim sweep to study reconstruction quality
  latent_dims: [2, 8, 32, 128]
  # Experiment: 2D latent visualization
  visualize_2d: false     # set true when latent_dim == 2
