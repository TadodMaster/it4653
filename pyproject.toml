[project]
name = "vae-mnist"
version = "0.1.0"
description = "Convolutional VAE on MNIST with KL warmup, GMM sampling, and FID evaluation"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.24",
    "scikit-learn>=1.3",      # GaussianMixture for the aggregate-posterior sampler
    "tensorboard>=2.15",      # SummaryWriter in train.py
    "matplotlib",
    "pandas",
    "tqdm"
]

[project.optional-dependencies]
# Only needed for evaluate.py — keeps the base install lighter.
eval = [
    "torchmetrics>=1.3",
    "torch-fidelity>=0.3",    # Inception weights used by torchmetrics FID
]

[project.scripts]
vae-train = "train:main"
vae-generate = "generate:main"
vae-evaluate = "evaluate:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.uv]
# Flat scripts at the repo root, not an installable package layout.
package = false

# ---------------------------------------------------------------------------
# PyTorch wheel source.
#
# PyPI's default torch wheel is CPU-only on some platforms and bundles a large
# CUDA runtime on others. Pinning an explicit index makes the build reproducible.
#
# Pick ONE block below. Change the cu### to match your driver — check with
# `nvidia-smi` and see https://pytorch.org/get-started/locally/ for the current
# list of index URLs. If you are on macOS or CPU-only, delete both blocks
# entirely: the plain PyPI wheels are correct there.
# ---------------------------------------------------------------------------

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cuda", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100